[tools]
python = "3.13"
uv = "latest"
ruff = "latest"

[env]
# uv-managed venv at .venv, auto-activated by mise
_.python.venv = { path = ".venv", create = true }

# --- Environment ---

[tasks.install]
description = "Sync local dev environment"
run = "uv pip install -e '.[dev,typing,cov]'"

[tasks.dev]
description = "Run the CLI (interactive menu)"
run = "hw-vx-config"

# --- Quality ---

[tasks.format]
description = "Format operations — fix rewrites, check is dry-run for CI (fix|check)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
action="${1:-fix}"
case "$action" in
  fix)   ruff format src/ tests/ && ruff check --fix src/ tests/ ;;
  check) ruff format --check src/ tests/ && ruff check src/ tests/ ;;
  *)     echo "Unknown action: $action (use fix|check)"; exit 1 ;;
esac
'''

[tasks.lint]
description = "Lint operations — check reports issues, fix auto-corrects (check|fix)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
action="${1:-check}"
case "$action" in
  check) ruff check src/ tests/ ;;
  fix)   ruff check --fix src/ tests/ ;;
  *)     echo "Unknown action: $action (use check|fix)"; exit 1 ;;
esac
'''

[tasks.typecheck]
description = "Static type check (mypy)"
run = "mypy src/"

[tasks.test]
description = "Test operations (unit|cov|matrix|tidy)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
action="${1:-}"
if [ -z "$action" ]; then
  echo "Usage: mise run test <action>"
  echo ""
  echo "Actions:"
  echo "  unit    Run pytest"
  echo "  cov     Run pytest with coverage report"
  echo "  matrix  Run tests on Python 3.10-3.13"
  echo "  tidy    Remove caches and build artifacts"
  exit 0
fi
case "$action" in
  unit) pytest tests/ -q ;;
  cov)  pytest tests/ -q --cov=hw_vx_config --cov-report=term-missing ;;
  matrix)
    for ver in 3.10 3.11 3.12 3.13; do
      echo "::group::Python $ver"
      uv run --extra dev --python "$ver" -- pytest tests/ -q
      echo "::endgroup::"
    done ;;
  tidy) find . -type d -name '__pycache__' -exec rm -rf {} + 2>/dev/null || true
        rm -rf .pytest_cache .mypy_cache .ruff_cache .coverage dist build ./*.egg-info ;;
  *)    echo "Unknown action: $action (use unit|cov|matrix|tidy)"; exit 1 ;;
esac
'''

[tasks.check]
description = "Full CI gate: lint + typecheck + test"
depends = ["lint", "typecheck"]
run = "pytest tests/ -q"
