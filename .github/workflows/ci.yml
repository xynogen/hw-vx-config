name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true

      - name: Lint & format
        run: |
          uv run --with ruff -- ruff check src/ tests/
          uv run --with ruff -- ruff format --check src/ tests/

      - name: Test on Python 3.10 - 3.13
        run: |
          for ver in 3.10 3.11 3.12 3.13; do
            echo "::group::Python $ver"
            uv run --extra dev --python "$ver" -- pytest tests/ -q
            echo "::endgroup::"
          done
